substitutions:
  _ENV: staging
  _REGION: asia-northeast1
  _ARTIFACT_REPO: trpg-evaluator
  _API_SERVICE: trpg-api-stg
  _FIREBASE_PROJECT_ID: ""
  _CORS_ALLOW_ORIGINS: ""

steps:
  - id: "Build API image"
    name: gcr.io/cloud-builders/docker
    args: [
      "build",
      "-f", "infra/docker/api.Dockerfile",
      "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/api:${_ENV}-${SHORT_SHA}",
      "."
    ]

  - id: "Push API image"
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/api:${_ENV}-${SHORT_SHA}"]

  - id: "Deploy API to Cloud Run"
    name: gcr.io/cloud-builders/gcloud
    args: [
      "run", "deploy", "${_API_SERVICE}",
      "--image", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/api:${_ENV}-${SHORT_SHA}",
      "--region", "${_REGION}",
      "--platform", "managed",
      "--allow-unauthenticated",
      "--set-env-vars", "API_ENV=${_ENV},FIREBASE_AUTH_DISABLED=0,FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},FIREBASE_CREDENTIALS_PATH=/secrets/firebase/credentials.json,CORS_ALLOW_ORIGINS=${_CORS_ALLOW_ORIGINS}",
      "--set-secrets", "/secrets/firebase/credentials.json=firebase-credentials:latest"
    ]
